name: conda-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # The suite, under the three builds that matter. conda-recipe/build.sh
  # already runs it inside the package build; this job is what makes the
  # OTHER two configurations exist, and they are where the bugs were:
  #
  #   -DNDEBUG   what every conda package is compiled with, and where three
  #              seeks written as assert() arguments silently vanished --
  #              `index -1` then gave 644 of 645 samples the same offset.
  #   ASan       a heap overrun in dsample (one byte past a bitset whenever
  #              the row count divided by 8) and an overread in fmt1 both sat
  #              in shipped code that every other build ran without complaint.
  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: release, cc: "cc -O3",                            env: ""}
          - {mode: ndebug,  cc: "cc -O3 -DNDEBUG",                   env: ""}
          # log_path: the report goes to a FILE, not the process's stderr. Many
          # tests send a command's stderr to /dev/null on purpose, and a report
          # that goes there leaves CI saying "FAIL" with a blank line under it.
          - {mode: asan,    cc: "cc -O1 -g -fsanitize=address,undefined",
             env: "ASAN_OPTIONS=detect_leaks=0:log_path=/tmp/san/asan UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1:log_path=/tmp/san/ubsan"}
    steps:
      - uses: actions/checkout@v4
      # The Makefile refuses to build without curl-config rather than quietly
      # dropping `yame fetch`, so a bare runner needs the dev package. The
      # conda legs get libcurl from the recipe's host deps instead.
      - name: Install libcurl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Build
        run: make -B CC="${{ matrix.cc }}" LDFLAGS="${{ matrix.mode == 'asan' && '-fsanitize=address,undefined' || '' }}"
      - name: Run the suite
        run: mkdir -p /tmp/san && env ${{ matrix.env }} make test
      - name: Sanitizer reports
        if: always() && matrix.mode == 'asan'
        run: |
          if ls /tmp/san/* >/dev/null 2>&1; then
            echo "::group::sanitizer reports"; cat /tmp/san/*; echo "::endgroup::"
            { echo '### Sanitizer reports'; echo '```'; cat /tmp/san/*; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else echo "no sanitizer reports"; fi

  # The badge is committed (docs/coverage.json, served from Pages), so it is
  # only as fresh as the last person who ran scripts/coverage.sh. This fails
  # when the two have drifted by more than the tolerance, in EITHER direction:
  # a suite that quietly lost coverage is as much a regression as a stale
  # badge, and gating on the value alone would only reward testing error paths.
  coverage:
    name: coverage badge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/coverage.json against the suite
        run: |
          scripts/coverage.sh --check 2>&1 | tee cov.txt
          {
            echo '### Line coverage of the test suite'
            echo '```'
            cat cov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The public library surface is everything reachable from src/cdata.h and
  # src/cfile.h -- downstream tools (methscope) include those two DIRECTLY,
  # and so see every header they pull in. Diffing only the two named files
  # was tried first and missed a real break on its first dry run: a macro
  # added to wzmisc.h (reached through cdata.h) clobbered a same-named
  # function in methscope. So the set is computed transitively, and any
  # change fails unless a commit since the last tag names the header. A
  # deliberate change passes by saying so; an accidental one is caught
  # before it ships. This is the check methscope's RELEASE.md step 1 did by
  # hand.
  api-surface:
    name: public headers vs last tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Diff the public header surface against the last tag
        run: |
          last=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          [ -n "$last" ] || { echo "no prior tag; nothing to compare"; exit 0; }
          ## the transitive closure of #include "..." from the two entry headers
          surface=$(python3 - <<'PY'
          import re, os
          seen, todo = [], ["src/cdata.h", "src/cfile.h"]
          while todo:
              h = todo.pop(0)
              if h in seen or not os.path.exists(h): continue
              seen.append(h)
              todo += ["src/" + i for i in re.findall(r'#include "([^"]+)"', open(h).read())]
          print(" ".join(sorted(seen)))
          PY
          )
          echo "public surface: $surface"
          changed=$(git diff --name-only "$last" HEAD -- $surface)
          [ -n "$changed" ] || { echo "public headers unchanged since $last"; exit 0; }
          echo "changed since $last:"; echo "$changed" | sed 's/^/  /'
          git diff "$last" HEAD -- $surface
          msg=$(git log --format=%B "$last..HEAD")
          for h in $changed; do
            b=$(basename "$h")
            echo "$msg" | grep -q "$b" ||
              { echo "::error::$b changed since $last but no commit since then names it"; exit 1; }
          done
          echo "every changed header is named in a commit message"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform is built even if one fails, so a single failure gives a
      # complete picture rather than one error. Publishing is a separate job
      # that requires them all, so this cannot half-release a version.
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-64}
          - {os: macos-14,      name: osx-arm64}
          # osx-64 (macos-13, Intel) is omitted: GitHub is retiring Intel
          # runners, so those jobs queue indefinitely. osx-arm64 covers modern
          # Macs, and bioconda still publishes osx-64.
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          # htslib is vendored in-tree rather than a submodule, so there is
          # nothing to recurse into -- harmless, and correct if that changes.
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        # Pinned: the globs in the publish job assume .conda output, which is
        # the current default but has changed before.
        run: conda install -n base -y "conda-build>=24.9" anaconda-client

      - name: Build package
        run: conda build -c conda-forge --output-folder "$RUNNER_TEMP/bld" conda-recipe/

      # The runner's glibc is far newer than users'. If the sysroot pin ever
      # comes loose the binary picks up symbols no ordinary machine has and
      # dies at startup -- how sesame-cli and tabl both shipped broken.
      - name: Check glibc floor (linux-64)
        if: matrix.name == 'linux-64'
        run: python tools/check_glibc_floor.py "$RUNNER_TEMP/bld"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.name }}
          path: ${{ runner.temp }}/bld/**/*.conda
          if-no-files-found: error

  # Publishing is its own job so a version is released for every platform or
  # for none: when each matrix leg uploaded for itself, a macOS failure beside
  # a Linux success left a version on the channel for linux-64 only.
  publish:
    name: publish to zhou-lab
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install anaconda-client
        run: conda install -n base -y anaconda-client

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: conda-*
          merge-multiple: true

      - name: Check the tag against both versions
        run: |
          # The tag must match BOTH the recipe version and the version compiled
          # into the binary. Checking only meta.yaml would let a package
          # labelled 1.29 ship a yame whose banner says 1.28.
          #
          # YAME_VERSION carries the leading "v" and the recipe version does
          # not, so both are compared without it.
          version=$(sed -n 's/.*set version = "\(.*\)".*/\1/p' conda-recipe/meta.yaml)
          binver=$(sed -n 's/.*YAME_VERSION "v\{0,1\}\(.*\)".*/\1/p' src/yame_version.h)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match recipe version $version; bump conda-recipe/meta.yaml" >&2
            exit 1
          fi
          if [ "$binver" != "$tag" ]; then
            echo "tag v$tag does not match YAME_VERSION $binver; bump src/yame_version.h" >&2
            exit 1
          fi

      - name: Upload
        env:
          # ANACONDA_API_TOKEN is anaconda-client's own variable. Passing the
          # token as `-t <token>` instead puts it in the runner's process table.
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "${ANACONDA_API_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN secret is not set; cannot publish." >&2
            exit 1
          fi
          # Retry each upload: anaconda.org has returned a 524 partway through a
          # release, aborting with one platform published and another not --
          # the half-release this job is shaped to prevent, arriving at the
          # upload step rather than the build step. --force makes a retry
          # idempotent.
          upload_with_retry() {
            pkg=$1
            n=1
            while [ "$n" -le 4 ]; do
              if conda run -n base anaconda upload \
                   -u zhou-lab --label main --force "$pkg"; then
                return 0
              fi
              echo "upload of $pkg failed (attempt $n); retrying in $((n * 30))s" >&2
              sleep $((n * 30))
              n=$((n + 1))
            done
            echo "upload of $pkg failed after 4 attempts" >&2
            return 1
          }

          found=0
          failed=0
          for pkg in dist/**/*.conda dist/*.conda; do
            [ -f "$pkg" ] || continue
            found=$((found + 1))
            echo "uploading $pkg"
            upload_with_retry "$pkg" || failed=$((failed + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "no .conda packages found in the downloaded artifacts" >&2
            exit 1
          fi
          # Every platform is attempted even if one is unrecoverable, so the log
          # names all of them rather than stopping at the first.
          if [ "$failed" -gt 0 ]; then
            echo "$failed of $found upload(s) failed; the release is incomplete" >&2
            exit 1
          fi
          echo "published $found package(s)"
