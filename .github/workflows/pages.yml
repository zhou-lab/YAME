name: Deploy docs to Pages

# docs/ is a self-contained static page -- no Jekyll, no Ruby, no gems. The
# directory is uploaded as-is, so a docs change deploys exactly what was
# reviewed in the diff.

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
